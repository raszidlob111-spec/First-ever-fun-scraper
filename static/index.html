<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardver Figyelő</title>
<style>
  :root {
    --bg: #12151c; --panel: #1a1f2b; --panel2: #212836; --border: #2c3446;
    --text: #e6e9ef; --muted: #8a92a6; --accent: #5b8cff; --good: #4caf6b;
    --warn: #e6b04c; --bad: #e05a5a; --pin: #f2c744;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; margin-right: 8px; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer; background: var(--panel2);
    border: 1px solid var(--border); color: var(--muted);
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .filters {
    display: flex; gap: 10px; padding: 12px 20px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  input, select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 112px); }
  .panel { overflow-y: auto; padding: 14px; }
  .panel + .panel { border-left: 1px solid var(--border); }
  .model-row {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .model-row:hover { background: var(--panel2); }
  .model-row.active { background: var(--panel2); border: 1px solid var(--accent); }
  .model-row .name { font-weight: 600; }
  .model-row .meta { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--bg); }
  tr.listing-row { cursor: pointer; }
  tr.listing-row:hover { background: var(--panel2); }
  tr.listing-row.county-hit { background: rgba(76,175,107,0.12); }
  .price { font-weight: 600; }
  .pin-btn { background: none; border: none; font-size: 15px; padding: 2px 6px; color: var(--muted); }
  .pin-btn.pinned { color: var(--pin); }
  .detail-row td { background: var(--panel2); padding: 10px; }
  .detail-row table { margin-top: 4px; }
  .county-badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  }
  .county-badge.target { background: var(--good); color: white; border-color: var(--good); }
  .heat {
    display: inline-block; min-width: 38px; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 600; text-align: center;
    background: var(--panel2); color: var(--muted);
  }
  .heat.hot { background: rgba(224,90,90,0.18); color: #ff8b8b; }
  .heat.warm { background: rgba(230,176,76,0.18); color: var(--warn); }
  .heat.cold { background: rgba(138,146,166,0.12); color: var(--muted); }
  .stale { color: var(--muted); font-style: italic; }
  #market-view { display: none; overflow-y: auto; height: calc(100vh - 112px); padding: 14px; }
  #market-view.open { display: block; }
  .note {
    background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; color: var(--muted); font-size: 12px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #compare-panel {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); max-height: 40vh; overflow-y: auto;
    padding: 10px 20px; display: none;
  }
  #compare-panel.open { display: block; }
  #compare-toggle {
    position: fixed; bottom: 14px; right: 20px; z-index: 5;
  }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Hardver Figyelő</h1>
  <div class="tabs" id="category-tabs"></div>
  <div class="tabs" id="view-tabs" style="margin-left:auto">
    <div class="tab active" data-view="browse">Böngészés</div>
    <div class="tab" data-view="market">Piac</div>
  </div>
</header>

<div class="filters">
  <input id="search" type="text" placeholder="Keresés modell/cím alapján...">
  <span id="county-controls" style="display:contents">
    <select id="county-filter">
      <option value="">Minden vármegye</option>
    </select>
    <button id="quick-county">Csak Szabolcs-Szatmár-Bereg</button>
  </span>
  <button id="reset-filters">Alaphelyzet</button>
  <span style="margin-left:auto; color: var(--muted)" id="result-count"></span>
</div>

<div class="layout" id="browse-view">
  <div class="panel" id="model-panel"></div>
  <div class="panel" id="listing-panel"></div>
</div>

<div id="market-view"></div>

<button id="compare-toggle" class="primary">Összehasonlítás (<span id="pin-count">0</span>)</button>
<div id="compare-panel"></div>

<script>
const state = {
  view: 'browse', // 'browse' | 'market'
  category: null,
  categories: [],
  county: '',
  q: '',
  model: null, // {category_key, model_key}
  expandedAdId: null,
};

const PINS_KEY = 'hap_pinned_ads';
function getPins() { try { return JSON.parse(localStorage.getItem(PINS_KEY) || '[]'); } catch { return []; } }
function setPins(list) { localStorage.setItem(PINS_KEY, JSON.stringify(list)); renderPinCount(); }
function isPinned(adId) { return getPins().some(p => p.ad_id === adId); }
function togglePin(listing) {
  let pins = getPins();
  if (isPinned(listing.ad_id)) {
    pins = pins.filter(p => p.ad_id !== listing.ad_id);
  } else {
    pins.push(listing);
  }
  setPins(pins);
  renderComparePanel();
}
function renderPinCount() {
  document.getElementById('pin-count').textContent = getPins().length;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('request failed: ' + url);
  return res.json();
}

function fmtFt(n) {
  if (n === null || n === undefined) return 'n/a';
  return Math.round(n).toLocaleString('hu-HU') + ' Ft';
}

function fmtDays(d) {
  if (d === null || d === undefined) return '–';
  if (d < 1) return Math.round(d * 24) + ' óra';
  return d.toFixed(1) + ' nap';
}

function fmtAgo(iso) {
  if (!iso) return '–';
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return mins + ' perce';
  if (mins < 1440) return Math.floor(mins / 60) + ' órája';
  return Math.floor(mins / 1440) + ' napja';
}

// Share of a model's recent supply that cleared. Thin samples get greyed out rather
// than hidden -- 1-of-2 is technically 50% but shouldn't read as a hot market.
function heatHtml(m) {
  if (m.sell_through_30d === null || m.sell_through_30d === undefined) {
    return '<span class="heat cold">–</span>';
  }
  const pct = Math.round(m.sell_through_30d * 100);
  let cls = 'cold';
  if (m.sample_size >= 4) {
    if (pct >= 50) cls = 'hot';
    else if (pct >= 25) cls = 'warm';
  }
  return `<span class="heat ${cls}">${pct}%</span>`;
}

function liquidityLine(m) {
  if (!m.closed_30d) return '<span class="stale">nincs még forgalmi adat</span>';
  const bits = [`${m.closed_30d} zárult/30n`];
  if (m.median_days_to_close !== null && m.median_days_to_close !== undefined) {
    bits.push('~' + fmtDays(m.median_days_to_close));
  }
  return heatHtml(m) + ' ' + bits.join(' · ');
}

async function init() {
  const [{categories}, {counties}] = await Promise.all([
    fetchJSON('/api/categories'), fetchJSON('/api/counties')
  ]);
  state.categories = categories;
  const tabsEl = document.getElementById('category-tabs');
  tabsEl.innerHTML = '';
  categories.forEach((c, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = c.category_label;
    tab.dataset.key = c.category_key;
    tab.onclick = () => selectCategory(c.category_key);
    tabsEl.appendChild(tab);
  });
  if (categories.length) state.category = categories[0].category_key;

  const countySelect = document.getElementById('county-filter');
  counties.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    countySelect.appendChild(opt);
  });

  document.getElementById('search').addEventListener('input', debounce(e => {
    state.q = e.target.value.trim(); state.model = null; refresh();
  }, 300));
  countySelect.addEventListener('change', e => { state.county = e.target.value; refresh(); });
  document.getElementById('quick-county').addEventListener('click', () => {
    state.county = 'Szabolcs-Szatmár-Bereg';
    countySelect.value = state.county;
    refresh();
  });
  document.getElementById('reset-filters').addEventListener('click', () => {
    state.county = ''; state.q = ''; state.model = null;
    countySelect.value = ''; document.getElementById('search').value = '';
    refresh();
  });
  document.querySelectorAll('#view-tabs .tab').forEach(t => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });
  document.getElementById('compare-toggle').addEventListener('click', () => {
    document.getElementById('compare-panel').classList.toggle('open');
    renderComparePanel();
  });

  renderPinCount();
  refresh();
}

function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function selectCategory(key) {
  state.category = key; state.model = null; state.expandedAdId = null;
  document.querySelectorAll('#category-tabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.key === key);
  });
  refresh();
}

function switchView(view) {
  state.view = view;
  document.querySelectorAll('#view-tabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  document.getElementById('browse-view').style.display = view === 'browse' ? 'grid' : 'none';
  document.getElementById('market-view').classList.toggle('open', view === 'market');
  // County is a property of an individual ad, not of a model's turnover, so it has
  // nothing to filter in the market view.
  document.getElementById('county-controls').style.display = view === 'browse' ? 'contents' : 'none';
  refresh();
}

async function refresh() {
  if (state.view === 'market') return loadMarket();
  await Promise.all([loadModels(), loadListings()]);
}

async function loadMarket() {
  const params = new URLSearchParams({ order: 'hot' });
  if (state.category) params.set('category', state.category);
  if (state.q) params.set('q', state.q);
  const { models } = await fetchJSON('/api/models?' + params);

  const view = document.getElementById('market-view');
  view.innerHTML = '';
  document.getElementById('result-count').textContent = models.length + ' modell';

  const note = document.createElement('div');
  note.className = 'note';
  note.innerHTML = 'A hardverapro ugyanúgy archiválja a hirdetést, akár elkelt, akár '
    + 'visszavonták vagy lejárt — ezért <strong>lezárás</strong>, nem garantált eladás. '
    + 'A „Forgás” az elmúlt 30 nap lezárásainak aránya a teljes kínálathoz képest.';
  view.appendChild(note);

  if (!models.length) {
    view.insertAdjacentHTML('beforeend', '<div class="empty">Nincs adat ehhez a kategóriához.</div>');
    return;
  }
  if (!models.some(m => m.closed_30d)) {
    view.insertAdjacentHTML('beforeend',
      '<div class="empty">Még nincs lezárási adat — a figyelő mostantól gyűjti. '
      + 'Az első használható számokhoz kb. egy nap folyamatos futás kell.</div>');
  }

  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>
    <th>Forgás</th><th>Modell</th><th>Aktív</th><th>Zárult 7n</th><th>Zárult 30n</th>
    <th>Medián idő</th><th>Utolsó zárás</th><th>Medián ár</th><th>Lezárt medián</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');

  models.forEach(m => {
    const tr = document.createElement('tr');
    tr.className = 'listing-row';
    tr.innerHTML = `
      <td>${heatHtml(m)}</td>
      <td><strong>${escapeHtml(m.model_key)}</strong></td>
      <td>${m.count}</td>
      <td>${m.closed_7d}</td>
      <td>${m.closed_30d}</td>
      <td>${fmtDays(m.median_days_to_close)}</td>
      <td>${fmtAgo(m.last_closed_at)}</td>
      <td class="price">${fmtFt(m.median_price)}</td>
      <td>${fmtFt(m.median_closed_price)}</td>
    `;
    // Jump straight from "this is hot" to "what's on sale right now".
    tr.onclick = () => {
      state.model = { category_key: m.category_key, model_key: m.model_key };
      state.expandedAdId = null;
      switchView('browse');
    };
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  view.appendChild(table);
}

async function loadModels() {
  const params = new URLSearchParams();
  if (state.category) params.set('category', state.category);
  if (state.q) params.set('q', state.q);
  const { models } = await fetchJSON('/api/models?' + params);

  const panel = document.getElementById('model-panel');
  panel.innerHTML = '';
  if (!models.length) {
    panel.innerHTML = '<div class="empty">Nincs adat még ehhez a kategóriához.</div>';
    return;
  }
  models.forEach(m => {
    const row = document.createElement('div');
    const active = state.model && state.model.model_key === m.model_key && state.model.category_key === m.category_key;
    row.className = 'model-row' + (active ? ' active' : '');
    row.innerHTML = `
      <div>
        <div class="name">${m.model_key}</div>
        <div class="meta">${m.count} db · ${fmtFt(m.min_price)} – ${fmtFt(m.max_price)}</div>
        <div class="meta">${liquidityLine(m)}</div>
      </div>
      <div class="meta" style="text-align:right">
        <div>medián</div>
        <div class="price">${fmtFt(m.median_price)}</div>
      </div>`;
    row.onclick = () => {
      state.model = { category_key: m.category_key, model_key: m.model_key };
      state.expandedAdId = null;
      loadModels(); loadListings();
    };
    panel.appendChild(row);
  });
}

async function loadListings() {
  const params = new URLSearchParams();
  if (state.category) params.set('category', state.category);
  if (state.county) params.set('county', state.county);
  if (state.model) params.set('model', state.model.model_key);
  if (state.q && !state.model) params.set('q', state.q);
  const { listings } = await fetchJSON('/api/listings?' + params);

  document.getElementById('result-count').textContent = listings.length + ' hirdetés';

  const panel = document.getElementById('listing-panel');
  panel.innerHTML = '';
  if (!listings.length) {
    panel.innerHTML = '<div class="empty">Nincs találat.</div>';
    return;
  }

  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>
    <th></th><th>Cím</th><th>Modell</th><th>Ár</th><th>Vármegye</th>
    <th>Eladó</th><th>Feladva</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');

  listings.forEach(l => {
    const tr = document.createElement('tr');
    tr.className = 'listing-row' + (l.county === 'Szabolcs-Szatmár-Bereg' ? ' county-hit' : '');
    const pinned = isPinned(l.ad_id);
    tr.innerHTML = `
      <td><button class="pin-btn${pinned ? ' pinned' : ''}" data-ad="${l.ad_id}">★</button></td>
      <td><a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.title)}</a></td>
      <td>${l.model_key || ''}</td>
      <td class="price">${fmtFt(l.price)}</td>
      <td><span class="county-badge${l.county === 'Szabolcs-Szatmár-Bereg' ? ' target' : ''}">${l.county || 'Ismeretlen'}</span></td>
      <td>${escapeHtml(l.seller || '')} ${l.rating ? '(' + escapeHtml(l.rating) + ')' : ''}</td>
      <td>${escapeHtml(l.posted_display || '')}</td>
    `;
    tr.querySelector('.pin-btn').onclick = (e) => { e.stopPropagation(); togglePin(l); e.target.classList.toggle('pinned'); };
    tr.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('button')) return;
      toggleExpand(l.ad_id, tr);
    });
    tbody.appendChild(tr);

    if (state.expandedAdId === l.ad_id) {
      tbody.appendChild(buildDetailRow(l));
    }
  });

  table.appendChild(tbody);
  panel.appendChild(table);
}

async function toggleExpand(adId, rowEl) {
  if (state.expandedAdId === adId) {
    state.expandedAdId = null;
  } else {
    state.expandedAdId = adId;
  }
  await loadListings();
}

function buildDetailRow(listing) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  const td = document.createElement('td');
  td.colSpan = 7;
  td.innerHTML = '<div class="empty">Betöltés...</div>';
  tr.appendChild(td);

  fetchJSON('/api/listings/' + encodeURIComponent(listing.ad_id)).then(({ similar }) => {
    if (!similar.length) {
      td.innerHTML = '<div class="empty">Nincs más ugyanilyen típusú hirdetés.</div>';
      return;
    }
    const sub = document.createElement('table');
    sub.innerHTML = `<thead><tr><th>Vármegye</th><th>Cím</th><th>Ár</th><th>Eladó</th><th>Feladva</th></tr></thead>`;
    const body = document.createElement('tbody');
    similar.forEach(s => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><span class="county-badge${s.county === 'Szabolcs-Szatmár-Bereg' ? ' target' : ''}">${s.county || 'Ismeretlen'}</span></td>
        <td><a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a></td>
        <td class="price">${fmtFt(s.price)}</td>
        <td>${escapeHtml(s.seller || '')}</td>
        <td>${escapeHtml(s.posted_display || '')}</td>
      `;
      body.appendChild(row);
    });
    sub.appendChild(body);
    td.innerHTML = `<strong>${listing.model_key}</strong> -- ugyanilyen típusú hirdetések vármegyénként:`;
    td.appendChild(sub);
  });

  return tr;
}

function renderComparePanel() {
  const panel = document.getElementById('compare-panel');
  const pins = getPins();
  if (!pins.length) {
    panel.innerHTML = '<div class="empty">Nincs kitűzött hirdetés. Kattints a ★ gombra egy hirdetésnél.</div>';
    return;
  }
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>
    <th></th><th>Kategória</th><th>Modell</th><th>Cím</th><th>Ár</th><th>Vármegye</th><th>Eladó</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  pins.forEach(l => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><button class="pin-btn pinned" data-ad="${l.ad_id}">✕</button></td>
      <td>${escapeHtml(l.category_label || '')}</td>
      <td>${escapeHtml(l.model_key || '')}</td>
      <td><a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.title)}</a></td>
      <td class="price">${fmtFt(l.price)}</td>
      <td><span class="county-badge${l.county === 'Szabolcs-Szatmár-Bereg' ? ' target' : ''}">${l.county || 'Ismeretlen'}</span></td>
      <td>${escapeHtml(l.seller || '')}</td>
    `;
    tr.querySelector('.pin-btn').onclick = () => { togglePin(l); renderComparePanel(); loadListings(); };
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.innerHTML = '';
  panel.appendChild(table);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

init();
</script>
</body>
</html>
